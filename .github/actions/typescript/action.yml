name: Typescript
description: Performs typescript checks
runs:
  using: composite
  steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2
      with:
        node-version: "17"
    - uses: bahmutov/npm-install@v1
    - run: npm run lint
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_SUB: 03-npm_run_lint
    - run: npm run test:types
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_SUB: 04-npm_run_test_types
