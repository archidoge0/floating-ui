name: "ghav human: Tests"
"on":
  push:
    branches:
      - ghav/dev/2164
    paths:
      - .ghav/human
jobs:
  checks:
    name: Linting and type checking
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions-human/setup
      - uses: ./.github/actions-human/typescript
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions-human/setup
      - uses: ./.github/actions/unit
  functional-tests:
    name: Functional tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions-human/setup
      - uses: ./.github/actions-human/functional
env:
  PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.playwright.dev
