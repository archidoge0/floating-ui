name: "ghav before: Tests"
"on":
  push:
    branches:
      - ghav/dev/2164
    paths:
      - .ghav/before
jobs:
  checks:
    name: Linting and type checking
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/typescript
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/unit
env:
  PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.playwright.dev
